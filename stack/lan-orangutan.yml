services:
  lan-orangutan:
    image: 291group/lan-orangutan:latest
    container_name: lan-orangutan
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      - ORANGUTAN_PORT=${ORANGUTAN_THEME}
      - TZ=${ORANGUTAN_TZ}
    volumes:
      - /portainer/Files/AppData/Config/lan-orangutan:/var/lib/lan-orangutan
